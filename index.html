<meta charset="UTF-8">

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --grad:linear-gradient(150deg,#FF9288,#F0627F);
  --bg:#EBC0B8;
  --panel:rgba(255,255,255,.68);
  --panel-solid:#FFFDFA;
  --line:rgba(80,40,30,.09);
  --line2:rgba(80,40,30,.16);
  --text:#2E1F1A;
  --muted:#8C766C;
  --soft:rgba(80,40,30,.045);
  --soft2:rgba(80,40,30,.08);
  --accent:#F0657A;
  --accent-deep:#CC4258;
  --accent-ink:#FFFFFF;
  --accent-soft:rgba(240,101,122,.12);
  --mint:#1E7F60; --mint-bg:rgba(30,127,96,.1);
  --amber:#B05400; --amber-bg:rgba(255,150,40,.14);
  --r:24px;
  --spring:cubic-bezier(.2,1.25,.35,1);
  --press:0 3px 0 rgba(80,40,30,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;font-size:16px;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
::placeholder{color:#BFA79C}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Background: warm light ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(150deg,#FCEDEA,#EBC0B8)}
.glow{position:absolute;width:70vmax;height:70vmax;border-radius:50%;will-change:transform;animation:drift 28s ease-in-out infinite alternate}
.g1{background:radial-gradient(circle,rgba(255,250,245,.6),transparent 60%);top:-35vmax;right:-25vmax}
.g2{background:radial-gradient(circle,rgba(230,130,130,.42),transparent 60%);bottom:-40vmax;left:-30vmax;animation-duration:34s;animation-delay:-10s}
.g3{background:radial-gradient(circle,rgba(255,250,245,.6),transparent 60%);top:25%;left:20%;animation-duration:40s;animation-delay:-20s}
.bub{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95) 0 14%,rgba(255,195,200,.42) 15%,rgba(255,130,140,.12) 70%);border:1.5px solid rgba(255,130,140,.38);will-change:transform;animation:rise linear infinite}
.bub i{position:absolute;inset:0;border-radius:50%;animation:sway 3.2s ease-in-out infinite alternate}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(.8);opacity:0}8%{opacity:1}50%{transform:translate3d(18px,-55vh,0) scale(1)}92%{opacity:.9}100%{transform:translate3d(-14px,-112vh,0) scale(1.1);opacity:0}}
.slice{position:absolute;opacity:.55;will-change:transform;animation:floaty ease-in-out infinite alternate}
.slice svg{width:100%;height:100%;animation:spin linear infinite;animation-duration:inherit}
@keyframes floaty{0%{transform:translate(0,0)}100%{transform:translate(30px,-60px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{position:absolute;border-radius:50%;border:2px solid rgba(255,140,70,.5);animation:pop .5s ease-out forwards;pointer-events:none}
@keyframes pop{from{transform:scale(1);opacity:1}to{transform:scale(1.8);opacity:0}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,5vmax) scale(1.1)}100%{transform:translate(-5vmax,10vmax) scale(.92)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(225,105,115,.17) 1px,transparent 1.3px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 75%)}
.grain{position:absolute;inset:-50%;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- Button system ---------- */
/* every button is a soft "pressable" pill: a small bottom edge that sinks when pressed */
.press{transition:transform .15s ease,box-shadow .15s ease,background .2s,border-color .2s,color .2s}
.press:active{transform:translateY(2px)}
.b-primary{background:var(--grad);color:var(--accent-ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 var(--accent-deep),0 12px 22px -12px var(--accent)}
.b-primary:hover{background:#F47A8C}
.b-primary:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 var(--accent-deep)}
.b-ghost{background:#fff;border:1.5px solid var(--line2);box-shadow:var(--press)}
.b-ghost:hover{border-color:var(--accent);color:var(--accent)}
.b-ghost:active{box-shadow:0 1px 0 rgba(80,40,30,.13)}
/* X buttons: small dark circle with a white cross, turns orange and spins */
.xb{width:22px;height:22px;border-radius:50%;background:var(--text);display:grid;place-items:center;flex:none;transition:transform .3s var(--spring),background .2s}
.xb svg{width:9px;height:9px;stroke:#fff}
.xb:hover{background:var(--accent);transform:rotate(90deg)}

/* ---------- Header ---------- */
.bar{position:sticky;top:0;z-index:30;transition:background .25s,box-shadow .25s}
.bar.scrolled{background:rgba(255,240,244,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line)}
.bar-in{max-width:1140px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#FFA9A6 0%,#EC5577 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 18px -8px rgba(255,79,139,.7);transition:transform .4s var(--spring)}
.logo svg{width:32px;height:32px}
.bar-in:hover .logo{transform:rotate(-8deg) scale(1.06)}
.brand{font-weight:800;font-size:22px;letter-spacing:-.9px;line-height:1}
.brand b{font-weight:800;background:linear-gradient(90deg,#F0657A,#FF4F8B);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{max-width:1140px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px 26px}
.hero h1{font-size:clamp(30px,7vw,52px);font-weight:300;letter-spacing:-1.5px;line-height:1.02;color:#3A2A22}
.hero h1 b{font-weight:800;color:#F0627F}
@keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}

/* ---------- Layout ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 18px 120px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.wrap>*{min-width:0}
@media (min-width:980px){
  .wrap{grid-template-columns:400px minmax(0,1fr);align-items:start;gap:24px;padding-bottom:48px}
  .panel-ings{position:sticky;top:20px}
}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.9);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(80,40,30,.04),0 20px 40px -24px rgba(200,80,100,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:40px}
.ph h2{font-size:20px;font-weight:700;letter-spacing:-.4px}
.icons{display:flex;gap:8px}
.tools{display:flex;align-items:center;gap:4px}
.clear-all{min-height:40px;padding:0 6px;font-size:14px;font-weight:600;color:var(--accent);animation:fadeIn .25s ease;transition:opacity .2s}
.clear-all:hover{text-decoration:underline;text-underline-offset:4px}
.clear-all[hidden]{display:none}
.tool{height:36px;width:38px;padding:0;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--accent);font-size:13.5px;font-weight:600;transition:background .2s,color .2s,transform .2s var(--spring)}
.tool svg{width:17px;height:17px;transition:transform .35s var(--spring)}
.tool:hover{background:var(--accent);color:#fff}
.tool:hover svg{transform:rotate(-15deg) scale(1.1)}
.tool:active{transform:scale(.92)}
.tool.danger{color:#B9876A}
.tool.danger:hover{background:#E5484D;color:#fff}
.tool.danger:hover svg{transform:none}
.tool .lid{transform-box:fill-box;transform-origin:100% 100%;transition:transform .35s var(--spring)}
.tool.danger:hover .lid{transform:translate(1px,-2px) rotate(18deg)}
.tool-sep{width:1px;height:18px;background:#FFC4C8}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ibtn svg{width:18px;height:18px}

/* ---------- Token field ---------- */
.field-wrap{position:relative}
.field{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:58px;padding:9px 14px;
  border:1.5px solid var(--line2);border-radius:22px;background:#fff;cursor:text;
  transition:border-color .2s,box-shadow .2s;
}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 5px rgba(240,101,122,.14)}
.field svg.s{width:18px;height:18px;stroke:var(--muted);flex:none}
.tok{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:999px;background:#FFEDEE;border:1px solid #FFD5D8;font-size:14px;font-weight:500;animation:tokIn .3s var(--spring)}
.tok.custom{background:#fff;border-style:dashed;border-color:var(--line2)}
.tok.more{padding:0 12px;color:var(--accent-ink);background:var(--grad);border-color:transparent;font-weight:700;cursor:pointer}
@keyframes tokIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.field input{flex:1;min-width:110px;height:38px;background:none;border:0;font-size:16px}
.field input:focus{outline:none}

.dd{position:absolute;top:calc(100% + 8px);right:0;left:0;z-index:20;list-style:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 24px 48px -18px rgba(170,60,80,.3);animation:ddIn .2s ease-out}
.dd[hidden]{display:none}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 12px;border-radius:12px;font-size:15px;text-align:right}
.opt small{color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.opt[aria-selected="true"],.opt:hover{background:#FFEDEE}
.opt .on{color:var(--accent);font-size:12.5px;font-weight:600;margin-inline-start:auto}
.opt.add-new{color:var(--accent);font-weight:500}

.browse{
  margin-top:14px;width:100%;height:52px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500;
}
.browse svg{width:17px;height:17px;stroke:currentColor}
.browse b{font-weight:700;color:var(--accent);margin-inline-start:2px}
.browse b:not(:empty)::before{content:"·";margin-inline-end:6px;color:var(--muted)}

/* ---------- Results ---------- */
.res-top{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.tabs{position:relative;flex:1;display:grid;grid-template-columns:repeat(3,1fr) .8fr;background:var(--soft2);border-radius:999px;padding:4px}
.tab-ind{position:absolute;top:4px;bottom:4px;right:4px;width:calc((100% - 8px)*.2632);background:var(--grad);border-radius:999px;box-shadow:0 8px 18px -8px rgba(240,101,122,.7);transition:transform .45s var(--spring),width .3s}
.tab{position:relative;z-index:1;min-height:44px;font-weight:500;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;transition:color .25s}
.tab[aria-selected="true"]{color:#fff;font-weight:600}
.tab .n{font-size:12.5px;font-weight:700;min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.3);color:#fff}
.dice{margin-inline-start:auto;width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center}
.dice svg{width:22px;height:22px;stroke:#fff}
.dice:hover svg{transform:rotate(-12deg)}
.dice svg{transition:transform .3s var(--spring)}
.dice.roll svg{animation:roll .6s var(--spring)}
@keyframes roll{to{transform:rotate(360deg) scale(1.1)}}
.bump{animation:bump .45s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}

.filters{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.fpill{height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.fpill[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff;box-shadow:0 3px 0 #000}
.fpill[aria-pressed="true"]:hover{color:#fff;border-color:var(--text)}

.grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{
  position:relative;overflow:hidden;
  display:grid;grid-template-columns:62px 1fr 30px;gap:4px 14px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px;text-align:right;width:100%;
  box-shadow:0 3px 0 rgba(80,40,30,.06);
  transition:transform .3s var(--spring),box-shadow .3s,border-color .25s;
}
.card::after{content:"";position:absolute;inset:auto auto -70px -50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 65%);opacity:0;transition:opacity .35s;pointer-events:none}
.card:hover{transform:translateY(-4px);border-color:#FFC9CE;box-shadow:0 6px 0 rgba(80,40,30,.06),0 22px 36px -20px rgba(225,90,110,.4)}
.card:hover::after{opacity:.28}
.card:active{transform:translateY(0)}
.card.enter{animation:cardIn .5s var(--spring) both}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.gl{width:62px;height:70px;border-radius:20px;display:grid;place-items:center;grid-row:span 2;background:#FFF2F2}
.gl svg{width:42px;height:56px;overflow:visible;transition:transform .45s var(--spring)}
.card:hover .gl svg{transform:rotate(-9deg) scale(1.08)}
.liq{transform-box:fill-box;transform-origin:50% 100%}
.card.enter .liq,.sheet .liq{animation:fill 1s .12s cubic-bezier(.3,.7,.3,1) both}
@keyframes fill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.card h3{font-size:17px;font-weight:700;line-height:1.2;letter-spacing:-.3px;position:relative;z-index:1}
.meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);grid-column:2;position:relative;z-index:1}
.meta .t{display:flex;align-items:center;gap:3px}
.meta .t svg{width:12px;height:12px;stroke:currentColor}
.badge{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft2);color:#6B5A4D}
.badge.a0{background:var(--mint-bg);color:var(--mint)}
.badge.a3{background:rgba(230,70,50,.12);color:#C2361F}
.dl{display:inline-flex;gap:3px}
.dl i{width:5px;height:5px;border-radius:50%;background:rgba(80,40,30,.15)}
.dl i.f{background:var(--accent)}
.go{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#FFEDEE;grid-row:1 / span 2;grid-column:3;transition:transform .3s var(--spring),background .2s;position:relative;z-index:1}
.go svg{width:14px;height:14px;stroke:var(--accent)}
.card:hover .go{background:var(--accent);transform:translateX(-4px)}
.card:hover .go svg{stroke:#fff}
.fav-tab svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
.fav-tab[aria-selected="true"] svg{fill:var(--accent);stroke:var(--accent)}
.heart{position:absolute;top:10px;left:46px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:transform .2s var(--spring),background .2s}
.heart:hover{background:var(--accent-soft)}
.heart:active{transform:scale(.85)}
.heart svg{width:19px;height:19px;fill:none;stroke:#C9B3A8;stroke-width:2;transition:fill .2s,stroke .2s}
.heart[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.heart.beat{animation:beat .5s var(--spring)}
@keyframes beat{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}
.heart.big{position:absolute;top:16px;right:16px;left:auto;width:44px;height:44px;background:#fff;border:1.5px solid var(--line2);box-shadow:var(--press)}
.heart.big svg{width:21px;height:21px}
.card h3{padding-left:30px}
.slot{grid-column:1 / -1;position:relative;z-index:1}
.slot:empty{display:none}
.status{display:flex;align-items:center;gap:6px;font-size:13px;border-radius:14px;padding:7px 11px;margin-top:8px}
.status svg{width:13px;height:13px;flex:none;stroke:currentColor}
.status.miss{background:var(--amber-bg);color:var(--amber)}
.status.swap{background:var(--mint-bg);color:var(--mint)}
.status b{font-weight:600}
.csearch{position:relative;margin-bottom:14px}
.csearch input{width:100%;height:46px;padding:0 42px 0 16px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-size:16px;transition:border-color .2s,box-shadow .2s}
.csearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.csearch svg{position:absolute;right:15px;top:50%;width:18px;height:18px;margin-top:-9px;stroke:var(--muted);pointer-events:none}
.divider{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:10px 0 2px;font-size:14px;font-weight:700;color:var(--muted)}
.divider::after{content:"";flex:1;height:1px;background:var(--line2)}
.divider.almost{color:var(--amber)}
.divider:first-child{margin-top:0}
.empty{grid-column:1/-1;text-align:center;padding:34px 12px;color:var(--muted)}
.empty svg{width:64px;height:86px;margin-bottom:8px;overflow:visible;animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.empty h3{color:var(--text);font-size:17px;font-weight:600}

/* ---------- Sheets ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(70,30,20,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.modal[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--panel-solid);width:100%;max-width:620px;max-height:93vh;max-height:93dvh;overflow-y:auto;overscroll-behavior:contain;
  border-radius:30px 30px 0 0;padding-bottom:env(safe-area-inset-bottom);position:relative;
  animation:sheetUp .5s var(--spring);
}
@keyframes sheetUp{from{transform:translateY(80px);opacity:.3}to{transform:none;opacity:1}}
@media (min-width:720px){.modal{align-items:center;padding:24px}.sheet{border-radius:30px;max-height:88vh}}
.close{position:sticky;top:12px;float:left;margin:12px 12px 0 0;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;z-index:3;background:#fff;border:1.5px solid var(--line2);box-shadow:var(--press);transition:transform .3s var(--spring),background .2s,border-color .2s}
.close:hover{transform:rotate(90deg);background:var(--text);border-color:var(--text)}
.close svg{width:13px;height:13px;stroke:var(--text);transition:stroke .2s}
.close:hover svg{stroke:#fff}
.s-hero{position:relative;text-align:center;padding:30px 20px 20px;overflow:hidden}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().replace(/[׳'"״`]/g,'').replace(/\s+/g,' ').trim();
const ingName = id => ING[id] ? ING[id].name : id;
const catName = id => (CATS.find(c=>c.id===id)||{}).name || '';
const ALC_LABEL = ['בלי אלכוהול','קליל','בינוני','חזק'];
const ALC_SHORT = ['0%','קליל','בינוני','חזק'];
const DIFF_LABEL = ['','קל','בינוני','למתקדמים'];
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function matchesQuery(ing,q){
  if(!q) return true;
  if(norm(ing.name).includes(q)) return true;
  return ing.aliases.some(a=>norm(a).includes(q));
}

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

const SPARK = ['#F0657A','#FFBDC0','#2E1F1A','#FFD8DA'];
function sparks(x,y){
  if(reduced()) return;
  for(let i=0;i<16;i++){
    const p = document.createElement('span');
    p.className = 'cf';
    const ang = Math.random()*Math.PI*2, dist = 40 + Math.random()*70;
    p.style.cssText = `left:${x}px;top:${y}px;background:${SPARK[i%4]};--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist-30}px`;
    p.addEventListener('animationend', ()=>p.remove());
    document.body.appendChild(p);
  }
}

const GLOBAL_SUBS = {
  sugar_syrup:{alt:['monin_cane'], tip:'מונין סוכר קנים עושה בדיוק את העבודה של סירופ סוכר.'},
  sugar:{alt:['monin_cane'], tip:'מונין סוכר קנים במקום סוכר: 10 מ״ל במקום כל כפית.'},
  grenadine:{alt:['monin_grenadine'], tip:'מונין גרנדין, אותו דבר בדיוק.'},
  triple_sec:{alt:['monin_blue'], tip:'מונין בלו קוראסאו במקום טריפל סק: יוצא כחול, מתוק יותר ובלי אלכוהול.'}
};
function analyze(r){
  const req = r.ing.filter(i=>!i.opt);
  const missing = [], swaps = [];
  let have = 0, haveReal = 0;
  for(const i of req){
    if(selected.has(i.id)){ have++; if(i.id!=='ice') haveReal++; continue; }
    const s = (r.subs||[]).find(s=>s.id===i.id);
    let alt = s && s.alt.find(a=>selected.has(a));
    let tip = s && s.tip;
    if(!alt && GLOBAL_SUBS[i.id]){
      alt = GLOBAL_SUBS[i.id].alt.find(a=>selected.has(a));
      tip = GLOBAL_SUBS[i.id].tip;
    }
    if(alt){ have++; haveReal++; swaps.push({id:i.id, alt, tip}); }
    else missing.push({id:i.id, sub:s});
  }
  return {missing, swaps, have, haveReal, total:req.length};
}

function passAlc(r){
  if(alcFilter==='na') return r.alc===0;
  if(alcFilter==='alc') return r.alc>0;
  return true;
}

function computeLists(){
  const all = RECIPES.filter(passAlc).map(r=>({r, a:analyze(r)}));
  const now = all.filter(x=>x.a.missing.length===0)
                 .sort((x,y)=>x.r.diff-y.r.diff || x.r.time-y.r.time);
  const almost = all.filter(x=>x.a.missing.length>0 && x.a.missing.length<=2 && x.a.haveReal>0)
                    .sort((x,y)=>x.a.missing.length-y.a.missing.length || y.a.haveReal-x.a.haveReal);
  const everything = [...all].sort((x,y)=>x.a.missing.length-y.a.missing.length);
  const fav = all.filter(x=>favs.has(x.r.id)).sort((x,y)=>x.a.missing.length-y.a.missing.length);
  return {now, almost, all:everything, fav};
}

/* dropdown (combobox) */
let ddItems = [], ddIndex = -1;
function renderDropdown(){
  const raw = $('#q').value.trim();
  const q = norm(raw);
  const dd = $('#dd');
  if(!q){ closeDropdown(); return; }
  const matches = INGS.filter(i=>matchesQuery(i,q))
    .sort((a,b)=>(norm(a.name).startsWith(q)?0:1)-(norm(b.name).startsWith(q)?0:1))
    .slice(0,6);
  ddItems = matches.map(i=>({type:'ing', id:i.id}));
  if(!matches.some(i=>norm(i.name)===q)) ddItems.push({type:'new', name:raw});
  ddIndex = 0;
  dd.innerHTML = ddItems.map((it,k)=> it.type==='ing'
    ? `<li><button class="opt" role="option" id="op${k}" data-k="${k}" aria-selected="${k===0}">${esc(ingName(it.id))}${selected.has(it.id)?'<span class="on">נבחר</span>':`<small>${catName(ING[it.id].cat)}</small>`}</button></li>`
    : `<li><button class="opt add-new" role="option" id="op${k}" data-k="${k}" aria-selected="${k===0}">הוספת "${esc(it.name)}"</button></li>`
  ).join('');
  dd.hidden = false;
  $('#q').setAttribute('aria-expanded','true');
  $('#q').setAttribute('aria-activedescendant','op0');
}
function closeDropdown(){
  $('#dd').hidden = true; ddItems = []; ddIndex = -1;
  $('#q').setAttribute('aria-expanded','false');
  $('#q').removeAttribute('aria-activedescendant');
}
function moveDD(d){
  if(!ddItems.length) return;
  ddIndex = (ddIndex + d + ddItems.length) % ddItems.length;
  document.querySelectorAll('#dd .opt').forEach((o,k)=>o.setAttribute('aria-selected', k===ddIndex));
  $('#q').setAttribute('aria-activedescendant','op'+ddIndex);
}
function pickDD(k){
  const it = ddItems[k];
  if(!it) return;
  const anchor = $('#field');
  if(it.type==='ing'){
    if(selected.has(it.id)){ toast('כבר בבר'); }
    else { selected.add(it.id); celebrate(afterChange(), anchor); }
  } else {
    const q = norm(it.name);
    if(!custom.some(n=>norm(n)===q)){ custom.push(it.name); afterChange(); toast('נוסף לבר'); }
  }
  $('#q').value = '';
  closeDropdown();
  $('#q').focus();
}

function renderPicker(){
  const q = norm($('#pkSearch').value);

  $('#pkBody').innerHTML = html;

const dl = n => `<span class="dl" title="קושי: ${DIFF_LABEL[n]}">${[1,2,3].map(i=>`<i class="${i<=n?'f':''}"></i>`).join('')}</span>`;

function statusHTML(a){
  if(a.missing.length===0){
    if(!a.swaps.length) return '';
    return `<div class="status swap">${SWAP_SM}<span>עם <b>${a.swaps.map(s=>esc(ingName(s.alt))).join(', ')}</b></span></div>`;
  }
  return `<div class="status miss">${PLUS_SM}<span>חסר: <b>${a.missing.map(m=>esc(ingName(m.id))).join(', ')}</b></span></div>`;
}

const cardCache = new Map();
function getCard(r){
  let el = cardCache.get(r.id);
  if(el) return el;
  el = document.createElement('div');
  el.setAttribute('role','button');
  el.tabIndex = 0;
  el.setAttribute('aria-label', r.name);
  el.className = 'card';
  el.dataset.r = r.id;
  el.style.setProperty('--c', r.color);
  el.style.setProperty('--gt', r.color + '55');
  el.innerHTML = `<span class="gl">${glassSVG(r.glass,r.color)}${r.iba?'<span class="ibatag" title="מתכון רשמי של איגוד הברמנים הבינלאומי">IBA</span>':''}</span>
    <button class="heart" data-fav="${r.id}" aria-pressed="${favs.has(r.id)}" aria-label="הוספה לאהובים: ${esc(r.name)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.3A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.6c0 5.7-7.5 10.3-7.5 10.3z"/></svg></button>
    <h3>${esc(r.name)}</h3>
    <span class="ings">${esc(r.ing.filter(i=>!i.opt && i.id!=='ice').slice(0,3).map(i=>ING[i.id].name.split(' / ')[0]).join(' · '))}</span>
    <span class="slot"></span>`;
  el._slot = el.querySelector('.slot');
  el._s = '';
  el.addEventListener('animationend', e=>{ if(e.animationName==='cardIn') el.classList.remove('enter'); });
  cardCache.set(r.id, el);
  return el;
}

let lastLists = null;
let shown = new Set();
let nowIds = null;
function renderResults(){
  const lists = computeLists();
  lastLists = lists;
  const newNow = new Set(lists.now.map(x=>x.r.id));
  const unlocked = nowIds ? lists.now.filter(x=>!nowIds.has(x.r.id)).map(x=>x.r) : [];
  if(nowIds && newNow.size !== nowIds.size){ bump($('#nNow')); bump($('#mbarPill').parentNode); }
  nowIds = newNow;
  $('#nNow').textContent = lists.now.length;
  $('#nAlmost').textContent = lists.almost.length;
  $('#nAll').textContent = lists.all.length;
  $('#nFav').textContent = lists.fav.length;

  const cq = norm($('#cq').value);
  const list = cq ? lists[tab].filter(x=>norm(x.r.name).includes(cq) || norm(x.r.en).includes(cq)) : lists[tab];
  const grid = $('#grid');
  if(!list.length){
    const realSel = [...selected].filter(id=>id!=='ice').length;
    let title;
    if(cq) title = 'לא מצאנו קוקטייל בשם הזה';
    else if(tab==='now') title = realSel===0 ? 'הכוס עוד ריקה' : 'עוד מרכיב או שניים...';
    else if(tab==='almost') title = 'אין כאן כלום כרגע';
    else if(tab==='fav') title = 'עוד אין אהובים. לחצו על הלב בקוקטייל';
    else title = 'אין מתכונים בסינון הזה';
    grid.innerHTML = `<div class="empty">${glassSVG('martini','#F3E3D3')}<h3>${title}</h3></div>`;
    shown = new Set();
  } else {
    let i = 0;
    const next = new Set();
    const nodes = [];
    let lastGroup = null;
    const groupOf = a => a.missing.length===0 ? 0 : a.missing.length<=2 ? 1 : 2;
    const GROUPS = ['אפשר להכין עכשיו','כמעט · חסר מרכיב או שניים','חסרים עוד כמה מרכיבים'];
    list.forEach(({r,a})=>{
      if((tab==='all' || tab==='fav') && (selected.size + custom.length) > 0){
        const g = groupOf(a);
        if(g!==lastGroup && (lastGroup!==null || g!==0)){
          const h = document.createElement('div');
          h.className = 'divider' + (g===1?' almost':'');
          h.innerHTML = `<span>${GROUPS[g]}</span>`;
          nodes.push(h);
        }
        lastGroup = g;
      }
      const el = getCard(r);
      const s = (selected.size + custom.length) ? statusHTML(a) : '';
      if(el._s !== s){ el._slot.innerHTML = s; el._s = s; }
      if(!shown.has(r.id)){
        el.classList.add('enter');
        el.style.animationDelay = Math.min(i++,10)*40+'ms';
      }
      next.add(r.id);
      nodes.push(el);
    });
    grid.replaceChildren(...nodes);
    shown = next;
  }
  updateBar();
  if(typeof refreshFeat==='function') refreshFeat();
  return unlocked;
}

function updateBar(){
  const n = selected.size + custom.length;
  $('#mbarPill').textContent = `${lastLists ? lastLists.now.length : 0} קוקטיילים`;
}

function celebrate(unlocked, el){
  if(!unlocked.length) return;
  if(el){ const r = el.getBoundingClientRect(); sparks(r.left + r.width/2, r.top + r.height/2); }
  toast(unlocked.length===1 ? `נפתח: ${unlocked[0].name}` : `נפתחו ${unlocked.length} קוקטיילים`);
}

function openRecipe(id){
  const r = RECIPES.find(x=>x.id===id);
  if(!r) return;
  const a = analyze(r);
  const ingHTML = r.ing.map(i=>{
    const name = i.t || ingName(i.id);
    let st, note = '';
    if(selected.has(i.id)) st = `<span class="st have" title="יש לכם">${I_HAVE}</span><span class="sr">יש לכם:</span>`;
    else {
      const sw = a.swaps.find(s=>s.id===i.id);
      if(sw){ st = `<span class="st sub" title="תחליף">${I_SUB}</span>`; note = `<span class="note">${esc(sw.tip)}</span>`; }
      else if(i.opt){ st = `<span class="st opt" title="רשות">${I_OPT}</span>`; note = '<span class="note">רשות</span>'; }
      else { st = `<span class="st need" title="חסר">${I_NEED}</span><span class="sr">חסר:</span>`; }
    }
    return `<li>${st}<div><span class="amt">${esc(i.a)}</span> ${esc(name)}${note}</div></li>`;
  }).join('');
  const subsHTML = (r.subs||[]).map(s=>`<li><b>${esc(ingName(s.id))}:</b> ${esc(s.tip)}</li>`).join('');

  const sheet = $('#sheet');
  sheet.style.setProperty('--c', r.color);
  sheet.innerHTML = `
    <button class="close" data-close aria-label="סגירה">${X_SM}</button>
    <div class="s-hero">
      <div class="gl">${glassSVG(r.glass,r.color)}</div>
      <button class="heart big" data-fav="${r.id}" aria-pressed="${favs.has(r.id)}" aria-label="הוספה לאהובים"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.3A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.6c0 5.7-7.5 10.3-7.5 10.3z"/></svg></button>
      <h2 id="mTitle">${esc(r.name)}</h2>
      <p class="en" dir="ltr">${esc(r.en)}</p>
      <p class="src ${r.iba?'is-iba':''}">${r.iba?'מתכון רשמי של IBA, איגוד הברמנים הבינלאומי':'גרסת הבית'}</p>
      <div class="taste">${r.taste.map(t=>`<span>${t}</span>`).join('')}</div>
    </div>
    <div class="sheet-body">
      <div class="facts">
        <div class="fact" title="אלכוהול">${F_ALC}<b>${ALC_LABEL[r.alc]}</b></div>
        <div class="fact" title="קושי">${F_DIFF}<b>${DIFF_LABEL[r.diff]}</b></div>
        <div class="fact" title="זמן הכנה">${F_TIME}<b>${r.time} דק׳</b>${r.timeNote?`<em>${esc(r.timeNote)}</em>`:''}</div>
        <div class="fact" title="כמות">${F_QTY}<b>${r.batch?'קנקן':'מנה'}</b></div>
      </div>
      <div class="sec"><h4>מה צריך</h4><ul class="ing-list">${ingHTML}</ul></div>
      <div class="sec"><h4>הכנה</h4>
        <ol class="steps">${r.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>
        ${r.shake?`<div class="tip">${BULB}<span>אין שייקר? צנצנת עם מכסה.</span></div>`:''}
      </div>
      <div class="two">
        <div class="sec"><h4>הגשה</h4><p>${esc(r.serve)}</p></div>
        <div class="sec"><h4>קישוט</h4><p>${esc(r.garnish)}</p></div>
      </div>
      ${subsHTML?`<div class="sec"><h4>חלופות</h4><ul class="subs">${subsHTML}</ul></div>`:''}
      <div class="two">
        <div class="sec"><h4>טעם</h4><p>${esc(r.tasteNote)}</p></div>

  openModal($('#modal'));
}

$('#q').addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); if($('#dd').hidden) renderDropdown(); else moveDD(1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); moveDD(-1); }
  else if(e.key==='Enter'){ e.preventDefault(); if(ddItems.length) pickDD(ddIndex); }
  else if(e.key==='Escape'){ closeDropdown(); }
  else if(e.key==='Backspace' && !e.target.value){
    if(custom.length){ custom.pop(); afterChange(); }
    else {
      const last = INGS.filter(i=>selected.has(i.id)).pop();
      if(last){ selected.delete(last.id); afterChange(); }
    }
  }
});

  if(all){
    const ids = INGS.filter(i=>i.cat===all.dataset.all).map(i=>i.id);
    const full = ids.every(id=>selected.has(id));
    ids.forEach(id=> full ? selected.delete(id) : selected.add(id));
    renderPicker(); renderPkCats(); afterChange();
    return;
  }
  const row = e.target.closest('.pick');
  if(!row) return;
  const id = row.dataset.id;
  const on = !selected.has(id);
  on ? selected.add(id) : selected.delete(id);
  row.setAttribute('aria-pressed', on);
  updatePickerDone(); renderPkCats();
  const unlocked = afterChange();
  if(unlocked.length){ const r = row.getBoundingClientRect(); sparks(r.left + r.width/2, r.top + r.height/2); }
});

function toggleFav(id, btn){
  const on = !favs.has(id);
  on ? favs.add(id) : favs.delete(id);
  document.querySelectorAll(`.heart[data-fav="${id}"]`).forEach(h=>{ h.setAttribute('aria-pressed', on); h.classList.remove('beat'); void h.offsetWidth; if(on) h.classList.add('beat'); });

  $('#nFav').textContent = lastLists ? computeLists().fav.length : favs.size;
  if(tab==='fav') renderResults();
  toast(on ? 'נוסף לאהובים' : 'הוסר מהאהובים');
}

  if(e.key==='Tab'){

/* rising bubbles in the background, like a fizzy drink */
(function(){
  if(reduced()) return;
  const bg = document.querySelector('.bg');
  const n = innerWidth < 640 ? 14 : 24;
  for(let i=0;i<n;i++){
    const b = document.createElement('span');
    b.className = 'bub';
    const s = 6 + Math.random()*Math.random()*34;
    b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${12+Math.random()*16}s;animation-delay:${-Math.random()*26}s`;
    bg.appendChild(b);
  }
  // fruit slices floating at different depths (blurred ones look farther away)
  const fruit = (rind,pith,flesh)=>{let seg='';for(let i=0;i<8;i++){const a=i*45*Math.PI/180;seg+=`<path d="M50 50 L${(50+38*Math.cos(a)).toFixed(1)} ${(50+38*Math.sin(a)).toFixed(1)}" stroke="${pith}" stroke-width="3"/>`}return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="${rind}"/><circle cx="50" cy="50" r="43" fill="${pith}"/><circle cx="50" cy="50" r="39" fill="${flesh}"/>${seg}<circle cx="50" cy="50" r="4" fill="${pith}"/></svg>`};
  const F = [['#FF8A3D','#FFF0DC','#FFB25C'],['#7CC24A','#F2FBE4','#A8DB6E'],['#F5C93A','#FFF8DA','#FFE07A'],['#F2667A','#FFE9E4','#FF9A8E']];
  const P = [[-8,8,120,0],[78,4,70,3],[70,40,150,6],[-10,58,90,2],[60,78,110,0],[20,30,46,1],[40,92,60,4],[88,66,40,1]];
  const k = innerWidth < 640 ? 1 : 1.6;
  P.forEach((p,i)=>{
    const d = document.createElement('div');
    d.className = 'fr';
    d.style.cssText = `left:${p[0]}%;top:${p[1]}%;width:${p[2]*k}px;filter:blur(${p[3]}px);opacity:${p[3]>3?.55:.8};animation-duration:${18+i*3}s;animation-delay:-${i*2}s`;
    d.innerHTML = fruit(...F[i%4]);
    d.firstChild.style.animationDuration = (50+i*6)+'s';
    bg.appendChild(d);
  });
})();

/* auto-update: if a newer version was published, load it (bypasses the browser's saved copy) */
const APP_VERSION = '29';
(async ()=>{
  try{
    if(!location.protocol.startsWith('http')) return;
    const res = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'});
    const m = (await res.text()).match(/const APP_VERSION = '(\d+)'/);
    if(m && m[1] !== APP_VERSION && sessionStorage.getItem('ht-upd') !== m[1]){
      sessionStorage.setItem('ht-upd', m[1]);
      location.replace(location.pathname + '?v=' + m[1]);
    }
  }catch(e){}
})();

/* ===== surprise card logic ===== */
let featId = null;
function featPool(){
  if(!lastLists) return [];
  return lastLists.now.length ? lastLists.now : lastLists.almost.length ? lastLists.almost : lastLists.all;
}
function showFeat(id, animate){
  const r = RECIPES.find(x=>x.id===id);
  const box = $('#feat');
  if(!r){ box.hidden = true; return; }
  featId = id;
  box.hidden = false;
  box.classList.add('instant','veiled');
  void box.offsetWidth;
  $('#featName').textContent = r.name;
  $('#featIngs').textContent = r.ing.filter(i=>!i.opt && i.id!=='ice').slice(0,3).map(i=>ING[i.id].name.split(' / ')[0]).join(' · ');
  $('#featGl').innerHTML = glassSVG(r.glass, r.color).replace(/rgba\(46,31,26,\.7\)/g,'#fff');
  $('#featCta').textContent = 'לגלות';
  void box.offsetWidth;
  box.classList.remove('instant');
  box.setAttribute('aria-label', 'קוקטייל בהפתעה. לחצו כדי לגלות');
  if(animate){ box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap'); }
}
function refreshFeat(){
  const pool = featPool();
  if(!pool.length){ $('#feat').hidden = true; featId = null; return; }
  if(!pool.some(x=>x.r.id===featId)) showFeat(pool[Math.floor(Math.random()*pool.length)].r.id, featId!==null);
}
$('#shuffle').addEventListener('click', e=>{
  e.stopPropagation();
  const pool = featPool().filter(x=>x.r.id!==featId);
  const btn = e.currentTarget;
  btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');
  if(pool.length) showFeat(pool[Math.floor(Math.random()*pool.length)].r.id, true);
});
function revealOrOpen(){
  const box = $('#feat');
  if(!featId) return;
  if(box.classList.contains('veiled')){
    box.classList.remove('veiled');
    $('#featCta').textContent = 'למתכון';
    box.setAttribute('aria-label', 'קוקטייל בהפתעה: ' + RECIPES.find(x=>x.id===featId).name);
    const r = box.getBoundingClientRect(); sparks(r.left + r.width*0.65, r.top + r.height*0.4);
  } else openRecipe(featId);
}
$('#feat').addEventListener('click', revealOrOpen);
$('#feat').addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.id==='feat'){ e.preventDefault(); revealOrOpen(); } });
refreshFeat();

renderTokens();
renderResults();
moveInd();
</script>
</body>
